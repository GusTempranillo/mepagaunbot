    campo: compatible
    yo: "si"
    maquina: "no"
    motivo_maquina: "la llamada se presume en inglés y no lo hablo con soltura"
    veredicto: regla
    explicacion: "La oferta es una llamada de teléfono a un número de Estados Unidos y no dice en qué idioma. La regla del idioma presunto, que aprobé el mismo día de la primera prueba, dice que se presume inglés. Yo la había clasificado antes de que esa regla existiera."
