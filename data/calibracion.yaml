# Calibración del clasificador.
#
# Las ofertas que me llegan por correo son las únicas que clasifiqué a
# mano, antes de que existiera la máquina. Este fichero es el resultado de
# dársela a clasificar sin enseñarle mis respuestas y contar en cuántas
# coincide. El procedimiento y el veredicto de cada desacuerdo están en
# /calibracion/.
#
# Los veredictos los escribo yo después de releer el anuncio original:
#   regla     el desacuerdo viene de un criterio que cambié después de
#             clasificar esa oferta a mano. La máquina aplica el criterio
#             vigente; yo apliqué el de entonces.
#   error     me equivoqué yo y la máquina tenía razón.
#   maquina   se equivocó la máquina.
#   pendiente todavía no lo he mirado. Sale así a propósito: prefiero
#             publicar un hueco a publicar un veredicto que no he dado.
#
# Lo escribe una automatización de n8n, pero los veredictos, no.

fecha: 2026-08-15
modelo: "kimi-k3 (reasoning_effort: low)"
criterios_version: 2
patron: "las ofertas que la plataforma me mandó por correo"
comparadas: 34
nota_patron: "El patrón crece solo, según entran alertas: eran 23 el 9 de agosto y son 34 el 15. Las que llegaron muertas (error 404) no tienen texto que clasificar y quedan fuera."
sin_respuesta: 0
abstenciones: 0

# Por qué cambió el modelo el 15 de agosto de 2026. Se midieron tres sobre
# este mismo patrón y con este mismo prompt:
#
#   kimi-k2.6      89,4 % de acuerdo   7284 tokens/oferta   3534 de razonar
#   kimi-k3 low    89,8 %              4043                   27
#   kimi-k3 high   89,8 %              4209                  182
#
# El que se usa acierta igual o algo más, cuesta un 44 % menos y razona 130
# veces menos. Subir el esfuerzo a «high» no cambia ni una clasificación.
comparacion_de_modelos:
  - modelo: "kimi-k2.6"
    acuerdo: "76/85"
    tokens_por_oferta: 7284
    de_ellos_razonamiento: 3534
  - modelo: "kimi-k3 (low)"
    acuerdo: "79/88"
    tokens_por_oferta: 4043
    de_ellos_razonamiento: 27
  - modelo: "kimi-k3 (high)"
    acuerdo: "79/88"
    tokens_por_oferta: 4209
    de_ellos_razonamiento: 182

campos:
  - campo: disponible_es
    pregunta: "¿Me dejan entrar?"
    hipotesis: "5"
    coinciden: 31
    comparadas: 34
    nota: "Es el único campo que el clasificador aporta a una hipótesis: la 5 se calcula sobre las ofertas del listado público."
  - campo: compatible
    pregunta: "¿Puedo hacerla?"
    hipotesis: "4"
    coinciden: 25
    comparadas: 31
    nota: "Aquí la máquina rechaza más que yo, y los seis desacuerdos tienen todos la misma forma: yo dije que sí y ella dice que no por la regla del idioma presunto."
  - campo: modalidad
    pregunta: "¿Dónde hay que estar?"
    hipotesis: "4"
    coinciden: 23
    comparadas: 23
    nota: "Las 23 son remotas: sin variación, este acuerdo no demuestra nada."

# Dos desacuerdos de la prueba anterior han desaparecido: los de «Send a Test
# Text Message», que salieron con veredicto «error» y corregí en su día. El
# procedimiento funciona.
desacuerdos:
