# Calibración del clasificador.
#
# Las ofertas que me llegan por correo son las únicas que clasifiqué a
# mano, antes de que existiera la máquina. Este fichero es el resultado de
# dársela a clasificar sin enseñarle mis respuestas y contar en cuántas
# coincide. El procedimiento y el veredicto de cada desacuerdo están en
# /calibracion/.
#
# Los veredictos los escribo yo después de releer el anuncio original:
#   regla     el desacuerdo viene de un criterio que cambié después de
#             clasificar esa oferta a mano. La máquina aplica el criterio
#             vigente; yo apliqué el de entonces.
#   error     me equivoqué yo y la máquina tenía razón.
#   maquina   se equivocó la máquina.
#   pendiente todavía no lo he mirado. Sale así a propósito: prefiero
#             publicar un hueco a publicar un veredicto que no he dado.
#
# Lo escribe una automatización de n8n, pero los veredictos, no.

fecha: 2026-08-16
modelo: "kimi-k3 (reasoning_effort: low)"
criterios_version: 3
patron: "las ofertas que la plataforma me mandó por correo"
comparadas: 34
nota_patron: "El patrón crece solo, según entran alertas: eran 23 el 9 de agosto y son 34 el 16. Las que llegaron muertas (error 404) no tienen texto que clasificar y quedan fuera."
sin_respuesta: 0
abstenciones: 0

# Por qué cambió el modelo el 15 de agosto de 2026. Se midieron tres sobre
# este mismo patrón y con este mismo prompt:
#
#   kimi-k2.6      89,4 % de acuerdo   7284 tokens/oferta   3534 de razonar
#   kimi-k3 low    89,8 %              4043                   27
#   kimi-k3 high   89,8 %              4209                  182
#
# El que se usa acierta igual o algo más, cuesta un 44 % menos y razona 130
# veces menos. Subir el esfuerzo a «high» no cambia ni una clasificación.
comparacion_de_modelos:
  - modelo: "kimi-k2.6"
    acuerdo: "76/85"
    tokens_por_oferta: 7284
    de_ellos_razonamiento: 3534
  - modelo: "kimi-k3 (low)"
    acuerdo: "79/88"
    tokens_por_oferta: 4043
    de_ellos_razonamiento: 27
  - modelo: "kimi-k3 (high)"
    acuerdo: "79/88"
    tokens_por_oferta: 4209
    de_ellos_razonamiento: 182

# Por qué compatible se hunde el 16 de agosto de 2026, sin que el
# clasificador haya empeorado. Ese día dejé de hacerle dos preguntas
# sueltas y le hice una: «¿puede optar?», con una sola barrera —de
# geografía o de idioma/habilidad— de la que se derivan disponible_es y
# compatible. Antes yo marcaba a veces el mismo obstáculo en los dos
# campos a la vez (p. ej. «exige número de EE. UU.» como disponible_es:no
# Y compatible:no). Ahora la barrera única solo alimenta uno —el de
# geografía, que es donde ya estaba en mis propios criterios—, así que
# esas dobles marcas mías desaparecen del campo compatible sin que el
# «¿puedo optar?» publicado cambie: seguía saliendo «no» por la otra
# columna. Es la mayoría de los 16 desacuerdos de compatible.
#
# Hay una excepción real, no cosmética: dos ofertas exigían a la vez un
# obstáculo de geografía Y uno de idioma, independientes entre sí. La
# barrera única solo puede reportar uno —eligió el de geografía— y el de
# idioma desaparece del todo de compatible, no solo se traslada. Si algún
# día ese obstáculo de geografía dejara de aplicar, la ficha diría
# «compatible: sí» sin que sea verdad. Es un límite real del diseño de una
# sola barrera por oferta, ya sabido y aceptado: el «¿puedo optar?»
# publicado no se equivoca en ningún caso de la muestra, pero el campo
# compatible en solitario deja de medir con precisión esos dos casos.
nota_pregunta_unica: "El 16 de agosto de 2026 el clasificador pasó a pedir una sola barrera en vez de dos juicios sueltos. La mayoría de los desacuerdos de compatible son la limpieza de un doble marcado que yo hacía antes; dos son un límite real y aceptado del diseño. Detalle en /calibracion/."

campos:
  - campo: disponible_es
    pregunta: "¿Me dejan entrar?"
    hipotesis: "5"
    coinciden: 33
    comparadas: 34
    nota: "Es el único campo que el clasificador aporta a una hipótesis: la 5 se calcula sobre las ofertas del listado público."
  - campo: compatible
    pregunta: "¿Puedo hacerla?"
    hipotesis: "4"
    coinciden: 18
    comparadas: 34
    nota: "El número baja de golpe al pasar a la pregunta única, pero no porque la máquina acierte menos: la mayoría de los 16 desacuerdos son dobles marcas mías de antes que ya no se pueden repetir en dos campos. Detalle en nota_pregunta_unica y en la tabla de abajo."
  - campo: modalidad
    pregunta: "¿Dónde hay que estar?"
    hipotesis: "4"
    coinciden: 31
    comparadas: 32
    nota: "32 de las 34 comparan: dos ofertas no las clasifiqué yo a mano. De las 32, una es un fallo real de la máquina, no de la pregunta única."

