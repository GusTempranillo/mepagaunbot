    campo: compatible
    yo: "si"
    maquina: "no"
    motivo_maquina: "exige narración de voz en vídeo, que se presume en inglés, y no lo hablo con soltura"
    veredicto: regla
    explicacion: "La oferta pide grabar la pantalla y el micrófono y «narrate your actions», sin decir en qué idioma. Se presume inglés, y no lo hablo con soltura. Yo la había clasificado antes de que existiera esa regla."
