# ───────────────────────────────────────────────────────────
#  Ofertas registradas. Definición del registro previo: se anotan
#  TODAS, también las que no interesan.
#
#  Este fichero lo escribe cada día una automatización a partir de
#  dos pestañas de la hoja de cálculo: "RentAHuman" (las alertas
#  que llegan al correo) y "Listado público" (el barrido diario
#  del listado de encargos). Se puede editar a mano: lo que se
#  escriba aquí solo se sobrescribe si la hoja trae un valor para
#  ese mismo campo.
#
#  en_email        "si" si la oferta llegó a la bandeja como alerta
#                  («matches your skills»). Denominador de la
#                  hipótesis 4.
#  en_listado      "si" si la oferta apareció en el listado público
#                  de encargos, encajase conmigo o no. Denominador
#                  de la hipótesis 5.
#
#  Los dos pueden ser "si" a la vez: una misma oferta puede llegar
#  por correo y estar además en el listado. Cuenta en los dos
#  denominadores, y por eso no se suman entre sí.
#
#  Las columnas de la alerta no se interpretan. Las cuatro últimas
#  las decide el autor, y miden cosas distintas:
#
#    disponible_es   ¿Me dejan entrar? Hipótesis 5, sobre en_listado
#                    "si". Solo cuenta presencia física fuera
#                    de España o una verificación, documentación o
#                    residencia que no pueda cumplir viviendo aquí.
#                    Ante la duda, "si": si me equivoco, que sea en
#                    mi contra.
#    motivo          El requisito literal que cierra la puerta.
#    modalidad       Hipótesis 4, solo sobre en_email "si": remota
#                    | presencial en Galicia | presencial fuera de
#                    Galicia.
#    compatible      ¿Puedo hacerla? Habilidades y equipo. Una oferta
#                    puede estar abierta y ser incompatible: eso es
#                    justo lo que se quiere ver. Misma regla que
#                    disponible_es: ante la duda, "si".
#    motivo_compat   Qué me falta, en corto.
#
#  En /ofertas/ los dos juicios se cruzan en una sola columna,
#  «¿Puedo optar?»: es "sí" cuando disponible_es y compatible son
#  los dos "si", y "no" en cuanto uno de los dos falle, con el
#  motivo o los motivos al lado.
#
#  Además, dos campos que no son un juicio sino una traducción, y uno
#  que dice quién ha pasado por la fila:
#
#    titulo_es       El título del encargo en español. Casi todas las
#                    ofertas llegan en inglés y el título original,
#                    sin tocar, sigue en «titulo».
#    resumen_es      Qué se pide, en dos o tres frases. No es el texto
#                    de la oferta: es un resumen.
#    revisado        "si" cuando he leído la fila y la he firmado.
#                    Vacío cuando lo que hay todavía es lo que propuso
#                    la máquina, sin repasar. La web lo marca.
#
#  Las de la bandeja las he clasificado yo a mano. Las del listado
#  las propone un modelo de lenguaje aplicando data/criterios.yaml,
#  que es público. Qué espera mi firma y qué no:
#
#    NO esperan   disponible_es, compatible y sus motivos, el título
#                 y el resumen en español. Los dos juicios porque son
#                 los que responden «¿puedo optar?» y una columna a
#                 medias no responde nada; los otros dos porque sin
#                 ellos la lista no hay quien la lea. Van marcados
#                 hasta que los repaso.
#    SÍ espera    modalidad, que es de la hipótesis 4 y solo aplica a
#                 las que llegan por correo.
#
#  La oferta se anota siempre, mirada o no: es el denominador. El
#  procedimiento entero está en /metodo/.
#
#  Vacío = sin clasificar (o no aplica a ese origen), y así se
#  muestra en /ofertas/.
#  Codificado el 2026-08-07, ampliado con en_email/en_listado el
#  2026-08-09, con la clasificación asistida el 2026-08-09 y con
#  compatible sin firma el 2026-08-10.
#  El texto de las ofertas no se reproduce: solo sus metadatos.
# ───────────────────────────────────────────────────────────

