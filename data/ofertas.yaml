#  Las columnas de la alerta no se interpretan. Las cuatro últimas
#  las decide el autor, y miden cosas distintas:
#
#    disponible_es   ¿Me dejan entrar? Hipótesis 5. Solo cuenta
#                    presencia física fuera de España o una
#                    verificación, documentación o residencia que no
#                    pueda cumplir viviendo aquí. Ante la duda, "si":
#                    si me equivoco, que sea en mi contra.
#    motivo          El requisito literal que cierra la puerta.
#    modalidad       Hipótesis 4: remota | presencial en Galicia |
#                    presencial fuera de Galicia.
#    compatible      Hipótesis 4: ¿puedo hacerla? Habilidades y
#                    equipo. Una oferta puede estar abierta y ser
#                    incompatible: eso es justo lo que se quiere ver.
#    motivo_compat   Qué me falta, en corto.
#
#  Vacío = sin clasificar, y así se muestra en /ofertas/.
#  Codificado el 2026-08-07. El texto de las ofertas no se reproduce:
#  solo sus metadatos.
