# Criterios de clasificación de ofertas
#
# Con esto se rellenan las cinco columnas de juicio de cada oferta:
# disponible_es, motivo, modalidad, compatible y motivo_compat. De paso, el
# mismo modelo escribe el título y el resumen en español de cada encargo,
# que no son un juicio sino una traducción: casi todas las ofertas llegan
# en inglés y sin ellas la lista no hay quien la lea.
#
# Un modelo de lenguaje las propone aplicando este fichero. Solo «modalidad»
# admite quedar en blanco cuando el modelo duda: los demás campos de juicio
# no se abstienen nunca, y si algo no está claro se anota en «pregunta» sin
# dejar la clasificación a medias.
#
# «disponible_es» se publica sin esperar a que yo repase la fila, y la
# columna «revisado» dice por cuáles he pasado: es el único campo que alimenta
# una hipótesis y su tasa de acierto está medida contra las ofertas que
# clasifiqué a mano y publicada en /calibracion/. «compatible» y
# «modalidad» sí esperan mi firma. El procedimiento entero está en /metodo/.
#
# Este fichero es público a propósito. Los criterios que aplica la máquina
# son exactamente estos, no otros, y si algún día los cambio el historial
# de git dice cuándo y en qué.

version: 3
fecha: 2026-08-16

# Qué cambió en la versión 3, en palabras sencillas: antes le hacía al modelo
# dos preguntas sueltas —¿me dejan entrar? y ¿puedo hacerla?— y cada una
# tenía su propio juicio, sin relación entre sí. Ahora le hago una sola
# pregunta —¿puedo optar a esta oferta?— y le pido que, si la respuesta es
# no, diga de qué tipo es el obstáculo: uno de geografía o papeleo, o uno de
# idioma, habilidad o aparato. De ese tipo salen los dos campos de siempre,
# calculados por código, no por el modelo. La regla de fondo —ante la duda,
# "no hay obstáculo"— no cambia: solo cambia que ahora se deriva de una sola
# respuesta en vez de pedirse dos veces.
#
# De paso corrijo algo que llevaba mal desde el 10 de agosto de 2026: la
# versión 2 de este fichero seguía diciendo que «compatible» admitía
# quedarse en blanco cuando dudaba, pero el clasificador dejó de aceptar eso
# ese mismo día sin que este fichero se enterase. Llevaba seis días
# contradiciendo al prompt del que forma parte. Ya no.

perfil:
  base: >-
    Un pueblo de Galicia, España. Trabajador dado de alta en RentAHuman
    como persona física.

  desplazamiento: >-
    Puedo desplazarme por toda España si el encargo cubre el viaje. Fuera
    de España, no.

  idiomas:
    - "Español: nativo. Escrito y hablado, incluida voz para grabaciones."
    - "Gallego: nativo. Escrito y hablado, incluida voz para grabaciones."
    - >-
      Inglés: lo leo y lo escribo con ayuda de traductor. No lo hablo con
      soltura. No sirvo para llamadas, entrevistas, reuniones ni
      grabaciones de voz o vídeo en inglés.

  aparatos:
    - "Móvil Android con número de teléfono español."
    - >-
      iPhone 13 Pro. Sirve para los encargos que piden un iPhone 11 o
      posterior, o iOS reciente.
    - "Ordenador con Windows."
    - "Ordenador Mac."
    - "Cámara de fotos y vídeo de calidad profesional."
    - "Micrófono decente para grabar voz."

  habilidades:
    - "Guion: soy guionista profesional."
    - "Voz: locución nativa en español y en gallego."
    - "Composición musical."
    - "Photoshop y edición de imagen: composición, retoque, preparación para imprenta."
    - "Fotografía y vídeo."
    - "Pruebas de software (QA): seguir un guion de pruebas, grabar la pantalla, redactar incidencias con pasos de reproducción."
    - "Redacción e investigación en español."
    - "Hojas de cálculo y trabajo con datos: etiquetar, clasificar, transcribir, limpiar."

  no_tengo:
    - "Residencia, documentación, cuenta bancaria ni número de teléfono de Estados Unidos."
    - "Experiencia acreditable en sectores especializados que no estén en la lista de arriba: ventas B2B, minería, farmacia, desarrollo web, medicina, derecho."
    - "Acceso a cuentas de terceros ni a encargos reservados a otro trabajador concreto de la plataforma."
    - "Vehículo comercial, licencias profesionales ni titulaciones regladas de ningún oficio."

# La pregunta que se le hace al modelo es una sola: ¿puedo optar a esta
# oferta? Pero la respuesta se cuenta en dos campos separados, porque miden
# dos cosas distintas y una de ellas —disponible_es— es la hipótesis 5 del
# registro previo, que pregunta por un trabajador cualquiera ubicado en
# España, no por mí. Fundirlas en un solo dato dejaría esa hipótesis sin
# poder resolverse tal como se firmó. Lo que se unifica es la pregunta al
# modelo, no la medición.

pregunta_unica:
  pregunta: >-
    ¿Puedo optar a esta oferta, con lo que soy y con lo que sé? Si la
    respuesta es no, ¿qué tipo de obstáculo es?

  barrera:
    pregunta: "Tipo de obstáculo, si lo hay."
    valores: ["ninguna", "geografia_papeleo", "idioma_habilidad_equipo"]
    cerrada: >-
      Estos tres valores y ninguno más. Un valor libre metería juicio del
      modelo donde tiene que haber una regla.
    geografia_papeleo: >-
      La oferta exige presencia física fuera de España, o una residencia,
      documentación, verificación, número de teléfono o cuenta bancaria que
      no se puede tener viviendo en España. Ejemplos: "exige estar ubicado
      en Estados Unidos", "exige un número de teléfono de EE. UU. real, no
      VoIP", "exige residencia legal en Estados Unidos o Reino Unido",
      "está reservada a una cuenta concreta de la plataforma".
    idioma_habilidad_equipo: >-
      La oferta pide un idioma que no manejo, una habilidad o una
      experiencia acreditable que no está en mi lista, un aparato o una
      documentación que no tengo, o un desplazamiento fuera de España que
      no sea, en sí mismo, un problema de geografía o papeleo. Ejemplos:
      "exige inglés nativo", "la locución se presume en inglés y no lo
      hablo con soltura", "exige experiencia probada en ventas B2B", "no
      dispongo de número de EE. UU." (este último cuenta aquí solo si el
      problema es de capacidad y no de residencia; si es de residencia, es
      geografia_papeleo).
    idioma_no_indicado: >-
      Cuando la oferta pide voz, locución, narración, vídeo hablado,
      llamada, entrevista o cualquier otra cosa que haya que decir en voz
      alta, y no dice en qué idioma, se presume el idioma en el que está
      escrita la oferta. Casi todas están escritas en inglés, así que casi
      siempre se presume inglés, y entonces la barrera es
      idioma_habilidad_equipo: "la locución se presume en inglés y no lo
      hablo con soltura". Esto no es una duda que haya que consultarme: es
      la presunción por defecto. Solo cuando la oferta declara el idioma y
      ese idioma es el español o el gallego, la voz es cosa mía.
    ninguna: >-
      No hay ningún obstáculo de los dos tipos de arriba. Lo que pide la
      oferta encaja con el perfil de este fichero.

  ante_la_duda: >-
    Barrera no admite abstención, en ninguna de sus dos mitades. Si no está
    claro si hay obstáculo de un tipo o de otro, se cuenta como si no lo
    hubiera: barrera = "ninguna". Es la misma regla en las dos mitades desde
    el 10 de agosto de 2026 —antes «compatible» sí admitía quedarse en
    blanco, ya no—: el error tiene que caer en mi contra, nunca a mi favor,
    y una fila sin decidir no responde nada. Si hay algo que preguntarme, se
    dice en «pregunta», pero la clasificación no espera esa respuesta.

  motivo:
    regla: >-
      Se rellena cuando barrera no es "ninguna". Una frase corta en
      español, en minúscula, sin punto final, que empiece por el verbo y
      diga qué puerta cierra: "exige residir en Estados Unidos" o "la
      locución se presume en inglés y no lo hablo con soltura". Si barrera
      es "ninguna", se deja vacío.

# Los dos campos de siempre, calculados por código a partir de la respuesta
# de arriba. El modelo no los rellena directamente.

campos_derivados:
  disponible_es:
    pregunta: >-
      ¿Podría hacer esta oferta cualquier persona ubicada en España, sea
      quien sea? No va de mí: va de la geografía y del papeleo.
    valores: ["si", "no"]
    calculo: >-
      "no" si barrera es "geografia_papeleo". "si" en cualquier otro caso.
      Nunca vacío: se publica sin esperar a que yo repase la fila y
      alimenta la hipótesis 5.
    motivo: "El motivo de la barrera geografia_papeleo, si la hay. Vacío si no."

  compatible:
    pregunta: >-
      ¿Puedo hacerla yo, con lo que sé y con lo que tengo? Es una pregunta
      de capacidad, no de voluntad: si sé hacerla, es "si" aunque no me
      apetezca.
    valores: ["si", "no"]
    calculo: >-
      "no" si barrera es "idioma_habilidad_equipo". "si" en cualquier otro
      caso. Nunca vacío, desde el 10 de agosto de 2026: se cruza con
      disponible_es para responder «¿puedo optar?» en la web, y un campo en
      blanco dejaría la fila sin respuesta.

  motivo_compat:
    regla: >-
      El motivo de la barrera idioma_habilidad_equipo, si la hay. Vacío si
      compatible es "si".

  modalidad:
    pregunta: ¿Dónde hay que estar para hacerla?
    valores: ["remota", "presencial en Galicia", "presencial fuera de Galicia"]
    regla: >-
      "remota" si se puede hacer entera desde casa. Si exige presencia
      física, "presencial en Galicia" cuando el sitio está en Galicia y
      "presencial fuera de Galicia" en cualquier otro caso, dentro o fuera
      de España. Es una clasificación mecánica: sale de la ubicación que
      declara la oferta. No depende de la pregunta única: se sigue pidiendo
      aparte, como siempre.

# La clasificación no juzga si el encargo me parece digno. Eso es la
# hipótesis 7 del registro previo, se decide en otro sitio y lo decido yo.
