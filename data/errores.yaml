# Registro numerado de errores sustanciales. Se tachan, no se borran.
# Las erratas y los typos no entran aquí.
#
# Los cuatro se cometieron el mismo día, durante la investigación previa
# al lanzamiento: por eso llevan orden y no hora. El orden importa —E2 es
# la corrección excesiva de E1—, la hora exacta no la puedo probar.

fecha_comun: 2026-07-27
contexto: "Los cuatro se cometieron el 27 de julio de 2026, durante la investigación previa, y se corrigieron antes de publicar el sitio. Van en el orden en que ocurrieron."

errores:
  - id: E1
    orden: 1
    dije: "La plataforma no tiene taxonomía propia de habilidades: cada cual escribe lo que quiere."
    pasa: "Sí la tiene. Hay dos niveles (un catálogo cerrado y un campo libre) y yo solo había visto el segundo."
    como: "El alta pide las habilidades en un campo de texto libre, donde se puede escribir cualquier cosa, y di por hecho que no había catálogo. Las ocho categorías cerradas estaban dos pantallas más adelante."


  - id: E2
    orden: 2
    dije: "Las habilidades salen únicamente de un catálogo cerrado."
    pasa: "El error contrario al anterior. El campo de texto libre existe, pero está en ajustes, no en el alta."
    como: ""

  - id: E3
    orden: 3
    dije: "Los horarios de disponibilidad no se pueden editar."
    pasa: "Sí se pueden. El editor solo aparece una vez activas la disponibilidad."
    como: ""

  - id: E4
    orden: 4
    dije: "Las condiciones de la plataforma son hostiles a operar con agentes de IA."
    pasa: "Las permiten de forma explícita."
    como: ""

  - id: E5
    orden: 5
    dije: "Mi perfil de RentAHuman declaraba el inglés entre mis idiomas."
    pasa: >
      No era cierto. Leo y escribo inglés con ayuda, y no lo hablo con
      fluidez. El 7 de agosto de 2026, a las 13:30, lo quité del perfil:
      quedan español y gallego.
    como: >
      El formulario no permite indicar el nivel ni distinguir entre hablado
      y escrito: o pones el idioma o no lo pones. Lo puse pensando en que lo
      leo, y al ponerlo estaba afirmando que lo manejo. No era inocuo: cuatro
      de las veinticinco ofertas que me habían llegado exigían inglés nativo.
      Cambiar el perfil a mitad del experimento cambia lo que la plataforma
      me ofrece, así que la serie de ofertas queda partida en esta fecha y
      los recuentos de antes y de después no se mezclan.
    fecha: 2026-07-26
    corregido: 2026-08-07

  - id: E6
    orden: 6
    dije: >
      La política de uso de RentAHuman tiene una cláusula (w) que prohíbe
      usar la mensajería interna para sacar de allí usuarios,
      comunicaciones o trabajo.
    pasa: >
      Esa cláusula no existe. Contrastada con la versión archivada del 20 de
      julio de 2026, la misma fecha que citaba, la política no tiene letras
      ni secciones numeradas: es una lista de puntos. Lo que sí dice, y me
      afecta, es que no se pueden subir contenidos de la plataforma
      (anuncios, mensajes, capturas, código, datos) a herramientas de IA
      externas «unless expressly authorized by RentAHuman». Es lo que hago:
      proceso capturas de mis encargos con IA (Claude, entre otras) para
      escribir sobre ellas, y no tengo autorización expresa. Pregunté a
      soporte si el proyecto entraba en conflicto con sus normas y no
      contestaron. He decidido seguir como hasta ahora y asumo el riesgo de
      que la plataforma actúe sobre mi cuenta.
    como: >
      Escribí la cita en la hipótesis 6 del registro previo sin contrastarla
      con el documento. Ese registro está sellado y no se edita, así que la
      cita sigue ahí, tal como se selló, y la corrección vive aquí.
    fecha: 2026-07-28
    corregido: 2026-09-18
