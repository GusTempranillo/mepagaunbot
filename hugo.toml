baseURL = 'https://mepagaunbot.eu/'
locale = 'es-ES'
title = 'Me paga un bot'
timeZone = 'Europe/Madrid'
enableEmoji = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  autor = 'Gustavo Pérez Tempranillo'
  oficio = 'Cronista de la inteligencia artificial'
  correo = 'tempranillo.ia@gmail.com'
  tagline = 'Mi agente de IA me encontró un empleo: trabajar para las IAs.'
  descripcion = 'Crónica de investigación en primera persona: 90 días alquilándome como mano de obra a agentes de IA en RentAHuman, con reglas publicadas antes de empezar, pruebas archivadas y errores a la vista.'
  inicio = '2026-07-27T09:00:00+02:00'
  fin = '2026-10-25'
  # Fecha del post cero. Alimenta el aviso de la portada y de /cronica/.
  post_cero = '2026-08-06'
  # URL pública de la newsletter (Buttondown) cuando exista; vacío = oculto
  newsletter = ''
  # Código de GoatCounter cuando exista (p. ej. 'mepagaunbot'); vacío = sin analítica
  goatcounter = 'tempranillo'
  # URL del repositorio público cuando exista; vacío = oculto
  repo = 'https://github.com/GusTempranillo/mepagaunbot'

[menus]
  [[menus.main]]
    name = 'Empieza aquí'
    pageRef = '/empieza-aqui'
    weight = 5
  [[menus.main]]
    name = 'Crónica'
    pageRef = '/cronica'
    weight = 10
  [[menus.main]]
    name = 'Datos'
    pageRef = '/datos'
    weight = 20
  [[menus.main]]
    name = 'Ofertas'
    pageRef = '/ofertas'
    weight = 25
  [[menus.main]]
    name = 'La tabla'
    pageRef = '/tabla'
    weight = 30
  [[menus.main]]
    name = 'Método'
    pageRef = '/metodo'
    weight = 40
  [[menus.main]]
    name = 'Registro previo'
    pageRef = '/registro-previo'
    weight = 45
  [[menus.main]]
    name = 'Errores'
    pageRef = '/errores'
    weight = 50
  [[menus.main]]
    name = 'Participa'
    pageRef = '/participa'
    weight = 60
  [[menus.main]]
    name = 'Sobre mí'
    pageRef = '/sobre-mi'
    weight = 70

[markup]
  [markup.goldmark.renderer]
    # Necesario para el separador de columnas de la portada ({{< col >}})
    # y para poder usar HTML puntual dentro de la crónica.
    unsafe = true

[outputs]
  home = ['html', 'rss', 'robots']
  section = ['html']
  page = ['html']

# El CSV descargable de /ofertas/ se genera de data/ofertas.yaml al construir,
# para que la tabla de la página y el fichero nunca puedan discrepar.
[outputFormats]
  [outputFormats.csv]
    mediaType = 'text/csv'
    path = 'datos'
    baseName = 'ofertas'
    isPlainText = true

[services]
  [services.rss]
    limit = 30
