{{- /* Las tablas de markdown se envuelven para que puedan desplazarse en
       pantallas estrechas en vez de ensanchar la página. */ -}}
<div class="tabla-scroll">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} style="text-align:{{ . }}"{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} style="text-align:{{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
